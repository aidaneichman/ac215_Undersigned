name: status page

# Rebuilds the team status page from the repository's issues, pull requests,
# commits and CI runs, and publishes it to GitHub Pages.
# CI runs on every push to main and every pull request, so the workflow_run trigger already
# rebuilds the page after each of those. Listing push and pull_request here as well made three
# runs fire for one push, and GitHub cancels the redundant two, which shows as a grey mark.
on:
  issues:
  pull_request_review:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 status/build_status.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
